server.port=8080
#logback\u6307\u5B9A\u914D\u7F6E\u6587\u4EF6\u8DEF\u5F84
logging.config=classpath:logback-spring.xml
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true

spring.datasource.url=jdbc:mysql://localhost:3306/gspw?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# MyBatis\u914D\u7F6E
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.config-location=classpath:mybatis-config.xml
mybatis-plus.global-config.banner=false

# Swagger\u914D\u7F6E
springfox.documentation.auto-startup=true
springfox.documentation.swagger-ui.enabled=true
springfox.documentation.swagger-ui.path=/swagger-ui.html
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# \u660E\u786E\u6307\u5B9A\u670D\u52A1\u5668\u5730\u5740\uFF08\u5173\u952E\u914D\u7F6E\uFF09
server.servlet.context-path=
springdoc.swagger-ui.base-url=http://localhost:8080

